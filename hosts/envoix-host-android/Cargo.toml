[package]
name = "envoix-host-android"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.envoix]
layer = "L7"
role = "composition-root"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The debug-only `E2eBridge` JNI entry points. Off by default, so a
# release-shaped build cannot compile them and the release cdylib exports no
# instrumentation symbol at all. `scripts/build-jni-libs.sh` enables it for the
# debug payload only.
e2e-instrumentation = []

[dependencies]
envoix-attempt-api = { path = "../../crates/l1/envoix-attempt-api" }
envoix-attempt-iroh = { path = "../../crates/l2/envoix-attempt-iroh" }
envoix-bindings = { path = "../../crates/l5/envoix-bindings" }
envoix-capabilities = { path = "../../crates/l1/envoix-capabilities" }
envoix-evidence = { path = "../../crates/l4/envoix-evidence" }
envoix-operation-store = { path = "../../crates/l2/envoix-operation-store" }
envoix-outcomes = { path = "../../crates/l0/envoix-outcomes" }
envoix-platform-android = { path = "../../crates/l6/envoix-platform-android" }
envoix-product = { path = "../../crates/l3/envoix-product" }
envoix-runtime = { path = "../../crates/l4/envoix-runtime" }
envoix-storage-api = { path = "../../crates/l1/envoix-storage-api" }
envoix-storage-local = { path = "../../crates/l2/envoix-storage-local" }
envoix-types = { path = "../../crates/l0/envoix-types" }
# The JNI lane compiles on every host, not only when cross-compiling for
# Android: the release gate proves the absence of the instrumentation entry
# points by BUILDING this cdylib and reading its exported symbols, and a claim
# about a compiled artifact is worth more than one about source text.
jni = "0.21"
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
