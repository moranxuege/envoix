[package]
name = "envoix-host-android"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.envoix]
layer = "L7"
role = "composition-root"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
envoix-attempt-api = { path = "../../crates/l1/envoix-attempt-api" }
envoix-attempt-iroh = { path = "../../crates/l2/envoix-attempt-iroh" }
envoix-bindings = { path = "../../crates/l5/envoix-bindings" }
envoix-capabilities = { path = "../../crates/l1/envoix-capabilities" }
envoix-operation-store = { path = "../../crates/l2/envoix-operation-store" }
envoix-outcomes = { path = "../../crates/l0/envoix-outcomes" }
envoix-platform-android = { path = "../../crates/l6/envoix-platform-android" }
envoix-product = { path = "../../crates/l3/envoix-product" }
envoix-runtime = { path = "../../crates/l4/envoix-runtime" }
envoix-storage-api = { path = "../../crates/l1/envoix-storage-api" }
envoix-storage-local = { path = "../../crates/l2/envoix-storage-local" }
envoix-types = { path = "../../crates/l0/envoix-types" }
tokio = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
tempfile = { workspace = true }
