name: apple-ci

# Routine Apple gate: compile macOS and run the hosted iOS contract tests once.
# UI, physical-device, and cross-device suites remain milestone/manual evidence.
on:
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/apple-ci.yml'
      - '.cargo/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'apps/envoix-apple/**'
      - 'crates/**'
      - 'vendor/**'
      - 'scripts/apple-dev.sh'
      - 'scripts/build-apple-core.sh'
      - 'scripts/with-build-cache-guard.sh'
      - 'scripts/build-cache-guard.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
  RUST_VERSION: 1.96.0
  CARGO_SWIFT_VERSION: 0.11.1
  XCODEGEN_VERSION: 2.45.4
  XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
  ENVOIX_APPLE_CORE_PROFILE: release
  ENVOIX_BUILD_CACHE_MIN_FREE_GIB: '1'
  ENVOIX_BUILD_CACHE_TARGET_FREE_GIB: '2'
  ENVOIX_IOS_SIM_DESTINATION: platform=iOS Simulator,OS=26.5,name=iPhone 17 Pro

jobs:
  apple:
    name: macOS build + iOS hosted tests
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare temporary build paths
        run: |
          printf 'ENVOIX_APPLE_CACHE_ROOT=%s\n' "$RUNNER_TEMP/envoix-apple-cache/$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          printf 'CARGO_INSTALL_ROOT=%s\n' "$RUNNER_TEMP/cargo-tools" >> "$GITHUB_ENV"
      - name: Restore cargo-swift
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/cargo-tools
          key: apple-cargo-swift-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ env.CARGO_SWIFT_VERSION }}
      - name: Set up pinned Apple tools
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add --toolchain "$RUST_VERSION" aarch64-apple-darwin aarch64-apple-ios-sim
          if [[ ! -x "$CARGO_INSTALL_ROOT/bin/cargo-swift" ]]; then
            scripts/with-build-cache-guard.sh cargo install cargo-swift --version "$CARGO_SWIFT_VERSION" --locked
          fi
          curl -L --fail --silent --show-error "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" -o "$RUNNER_TEMP/xcodegen.zip"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          printf '%s\n' "$CARGO_INSTALL_ROOT/bin" >> "$GITHUB_PATH"
      - name: Build macOS app
        env:
          ENVOIX_APPLE_CORE_TARGET: aarch64-apple-darwin
        run: |
          scripts/apple-dev.sh macos-build
          test -x "$ENVOIX_APPLE_CACHE_ROOT/macos-debug/Build/Products/Debug/Envoix.app/Contents/MacOS/Envoix"
      - name: Run iOS hosted tests
        env:
          ENVOIX_APPLE_CORE_TARGET: aarch64-apple-ios-sim
        run: >-
          scripts/apple-dev.sh ios-test hosted
          -skip-testing:Envoix-iOSUITests/WifiAwareCapabilityTests/testPhysicalDeviceReportsWifiAwarePairingCapability
          -skip-testing:Envoix-iOSUITests/WifiAwarePhysicalRendezvousTests
          -skip-testing:Envoix-iOSUITests/WifiAwarePhysicalTransferTests
          -skip-testing:Envoix-iOSUITests/ManifestV2PhysicalTransferTests/testSendScenarioProductActivityRoom
          -skip-testing:Envoix-iOSUITests/ManifestV2PhysicalTransferTests/testReceiveScenarioProductActivityRoom
      - name: Shut down Simulator
        if: always()
        run: xcrun simctl shutdown all
