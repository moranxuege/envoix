name: rendezvous server artifact

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  RUST_VERSION: 1.96.0
  ENVOIX_BUILD_CACHE_MIN_FREE_GIB: '1'
  ENVOIX_BUILD_CACHE_TARGET_FREE_GIB: '2'

jobs:
  build:
    name: build glibc-compatible Linux broker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    container:
      image: rust:1.96.0-bullseye@sha256:5ebdedce38fc37fb279c5b35b2832298e769ccf3385240846ab4fc983f00fa0f
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y \
            binutils \
            file \
            pkg-config

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify pinned toolchain and build ABI
        run: |
          rustc_version="$(rustc --version)"
          case "$rustc_version" in
            "rustc $RUST_VERSION "*) ;;
            *)
              echo "container Rust version does not match $RUST_VERSION: $rustc_version" >&2
              exit 1
              ;;
          esac
          printf '%s\n' "$rustc_version"
          ldd --version | head -n 1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build rendezvous server
        run: >-
          scripts/with-build-cache-guard.sh
          cargo build --locked --release -p envoix-rendezvous-server

      - name: Stage and verify artifact
        run: |
          mkdir -p dist
          server="dist/envoix-broker-linux-x86_64"
          cp target/release/envoix-rendezvous-server "$server"
          file "$server"
          if ! readelf -l "$server" | grep -q \
            'Requesting program interpreter: /lib64/ld-linux-x86-64.so.2'; then
            echo "rendezvous server has an unexpected ELF interpreter" >&2
            exit 1
          fi
          max_glibc="$(
            readelf --version-info "$server" \
              | sed -n 's/.*Name: GLIBC_\([0-9.]*\).*/\1/p' \
              | sort -Vu \
              | tail -n 1
          )"
          test -n "$max_glibc"
          if [ "$(printf '%s\n' "$max_glibc" 2.31 | sort -V | tail -n 1)" != 2.31 ]; then
            echo "rendezvous server requires unsupported glibc $max_glibc" >&2
            exit 1
          fi
          printf 'maximum required glibc: %s\n' "$max_glibc"
          ldd "$server"

      - name: Attest broker build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/envoix-broker-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: envoix-broker-linux-x86_64
          path: dist/envoix-broker-linux-x86_64
          if-no-files-found: error
