name: release

# Builds the envoix CLI for Linux, macOS arm64+x86_64, and Windows. Android is
# intentionally absent until M8 provides production signing and verification.
#   - push a tag `vX.Y.Z`  -> builds everything and attaches it to a GitHub Release
#   - run manually (Actions -> release -> Run workflow) -> builds everything as
#     downloadable run artifacts, without publishing a release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source ref to package (for release repair, use the immutable tag)
        required: false
        type: string

permissions:
  contents: write # needed to create the release

env:
  RUST_VERSION: 1.96.0

jobs:
  cli:
    name: build CLI ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: envoix-cli-linux-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            name: envoix-cli-macos-aarch64
          - os: macos-14
            target: x86_64-apple-darwin
            name: envoix-cli-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: envoix-cli-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up pinned Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add --toolchain "$RUST_VERSION" ${{ matrix.target }}
          rustc --version

      - name: Build envoix CLI
        run: cargo build --locked --release -p envoix-cli --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/envoix.exe" "dist/${{ matrix.name }}"
          else
            cp "target/${{ matrix.target }}/release/envoix" "dist/${{ matrix.name }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error

  release:
    name: publish release
    needs: [cli]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes="docs/releases/${{ github.ref_name }}.md"
          if [ -f "$notes" ]; then
            gh release create "${{ github.ref_name }}" dist/* \
              --title "Envoix ${{ github.ref_name }}" \
              --notes-file "$notes" \
              --repo "${{ github.repository }}"
          else
            gh release create "${{ github.ref_name }}" dist/* \
              --title "Envoix ${{ github.ref_name }}" \
              --generate-notes \
              --repo "${{ github.repository }}"
          fi
