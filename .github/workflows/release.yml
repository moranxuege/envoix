name: release

# Builds the envoix CLI (Linux / macOS arm64+x86_64 / Windows), the Windows /
# Linux graphical desktop demo, and the Android APK (multi-ABI: arm64-v8a +
# x86_64, test-signed release build).
#   - push a tag `vX.Y.Z`  -> builds everything and attaches it to a GitHub Release
#   - run manually (Actions -> release -> Run workflow) -> builds everything as
#     downloadable run artifacts, without publishing a release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source ref to package (for release repair, use the immutable tag)
        required: false
        type: string

permissions:
  contents: write # needed to create the release

jobs:
  cli:
    name: build CLI ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: envoix-cli-linux-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            name: envoix-cli-macos-aarch64
          - os: macos-14
            target: x86_64-apple-darwin
            name: envoix-cli-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: envoix-cli-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Rust (iroh needs >= 1.91)
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}
          rustc --version

      - name: Build envoix CLI
        run: cargo build --locked --release -p envoix-cli --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/envoix.exe" "dist/${{ matrix.name }}"
          else
            cp "target/${{ matrix.target }}/release/envoix" "dist/${{ matrix.name }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error

  desktop:
    name: build desktop ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: Envoix-Desktop-Linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: Envoix-Desktop-Windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Rust (iroh needs >= 1.91)
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}
          rustc --version

      - name: Install Linux desktop build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Build graphical desktop app
        run: cargo build --locked --release -p envoix-desktop --target ${{ matrix.target }}

      - name: Stage desktop binary
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/envoix-desktop.exe" "dist/${{ matrix.name }}"
          else
            cp "target/${{ matrix.target }}/release/envoix-desktop" "dist/${{ matrix.name }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error

  android:
    name: build android apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust + Android targets
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android
          rustc --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r26 + SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"

      - name: Test, lint, and build release APK
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
          ENVOIX_ANDROID_ABIS: arm64-v8a,x86_64
        run: ./gradlew testReleaseUnitTest lintRelease assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/envoix-android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: envoix-android.apk
          path: dist/envoix-android.apk
          if-no-files-found: error

  release:
    name: publish release
    needs: [cli, desktop, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes="docs/releases/${{ github.ref_name }}.md"
          if [ -f "$notes" ]; then
            gh release create "${{ github.ref_name }}" dist/* \
              --title "Envoix ${{ github.ref_name }}" \
              --notes-file "$notes" \
              --repo "${{ github.repository }}"
          else
            gh release create "${{ github.ref_name }}" dist/* \
              --title "Envoix ${{ github.ref_name }}" \
              --generate-notes \
              --repo "${{ github.repository }}"
          fi
