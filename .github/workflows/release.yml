name: release

# Builds the paired CLI and Agent for Linux/Windows, plus the standalone CLI for
# macOS arm64+x86_64. Android is intentionally absent until M8 provides
# production signing and verification.
#   - push a tag `vX.Y.Z`  -> builds everything and attaches it to a GitHub Release
#   - run manually (Actions -> release -> Run workflow) -> builds everything as
#     downloadable run artifacts, without publishing a release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source ref to package (for release repair, use the immutable tag)
        required: false
        type: string

permissions:
  contents: write # needed to create the release

env:
  RUST_VERSION: 1.96.0
  ENVOIX_BUILD_CACHE_MIN_FREE_GIB: '1'
  ENVOIX_BUILD_CACHE_TARGET_FREE_GIB: '2'

jobs:
  contract:
    name: validate immutable release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Validate version, tag, and pinned actions
        env:
          ENVOIX_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          args=()
          if [ -n "$ENVOIX_RELEASE_TAG" ]; then
            args+=(--tag "$ENVOIX_RELEASE_TAG")
          fi
          python3 scripts/release_contract.py "${args[@]}"

  cli:
    name: build desktop binaries ${{ matrix.artifact }}
    needs: [contract]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: envoix-linux-x86_64
            cli_name: envoix-cli-linux-x86_64
            agent_package: -p envoix-agent
            agent_name: envoix-agent-linux-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: envoix-cli-macos-aarch64
            cli_name: envoix-cli-macos-aarch64
            agent_package: ''
            agent_name: ''
          - os: macos-14
            target: x86_64-apple-darwin
            artifact: envoix-cli-macos-x86_64
            cli_name: envoix-cli-macos-x86_64
            agent_package: ''
            agent_name: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: envoix-windows-x86_64
            cli_name: envoix-cli-windows-x86_64.exe
            agent_package: -p envoix-agent
            agent_name: envoix-agent-windows-x86_64.exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up pinned Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add --toolchain "$RUST_VERSION" ${{ matrix.target }}
          rustc --version

      - name: Build envoix CLI
        shell: bash
        run: >-
          scripts/with-build-cache-guard.sh
          cargo build --locked --release -p envoix-cli ${{ matrix.agent_package }}
          --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/envoix.exe" "dist/${{ matrix.cli_name }}"
            cp "target/${{ matrix.target }}/release/envoix-agent.exe" "dist/${{ matrix.agent_name }}"
          else
            cp "target/${{ matrix.target }}/release/envoix" "dist/${{ matrix.cli_name }}"
            if [ -n "${{ matrix.agent_name }}" ]; then
              cp "target/${{ matrix.target }}/release/envoix-agent" "dist/${{ matrix.agent_name }}"
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: [cli]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Download all binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes="docs/releases/${{ github.ref_name }}.md"
          if [ -f "$notes" ]; then
            gh release create "${{ github.ref_name }}" dist/* \
              --title "Envoix ${{ github.ref_name }}" \
              --notes-file "$notes" \
              --repo "${{ github.repository }}"
          else
            gh release create "${{ github.ref_name }}" dist/* \
              --title "Envoix ${{ github.ref_name }}" \
              --generate-notes \
              --repo "${{ github.repository }}"
          fi
