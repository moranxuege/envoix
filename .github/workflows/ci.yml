name: ci

# One routine gate for shared Rust and Android product code. Documentation and
# Apple-only changes are handled elsewhere and do not consume Linux runners.
on:
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/ci.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'apps/envoix-agent/**'
      - 'apps/envoix-cli/**'
      - 'apps/envoix-rendezvous-server/**'
      - 'crates/**'
      - 'vendor/**'
      - 'android/**'
      - 'scripts/check-android-jni-transfer-surface.sh'
      - 'scripts/cross-device-transfer-matrix.sh'
      - 'scripts/matrix_contract.py'
      - 'scripts/windows-agent-lifecycle-test.ps1'
      - 'scripts/tests/**'
      - 'scripts/with-build-cache-guard.sh'
      - 'scripts/build-cache-guard.sh'
      - 'tests/e2e/matrix/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.96.0
  CARGO_AUDIT_VERSION: 0.22.2
  ENVOIX_BUILD_CACHE_MIN_FREE_GIB: '1'
  ENVOIX_BUILD_CACHE_TARGET_FREE_GIB: '2'

jobs:
  core:
    name: contracts + Rust + security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Set up pinned Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_VERSION"
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Validate repository contracts
        run: |
          python3 scripts/matrix_contract.py validate-registry tests/e2e/matrix/cases.v1.json
          python3 scripts/release_contract.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          bash -n scripts/cross-device-transfer-matrix.sh
          if grep -R -n -E --include='*.rs' 'pub use envoix_(session|transfer)::\*' crates/envoix-client/src; then
            echo 'envoix-client must not wildcard-export lower architectural layers' >&2
            exit 1
          fi
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust
        run: >-
          scripts/with-build-cache-guard.sh
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test Rust
        run: >-
          scripts/with-build-cache-guard.sh
          cargo test --locked --workspace --all-targets --all-features
      - name: Install pinned cargo-audit
        run: >-
          scripts/with-build-cache-guard.sh
          cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
      - name: Audit Rust dependencies
        run: cargo audit --deny unsound

  windows:
    name: Windows CLI + Agent
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pinned Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Lint Windows CLI and Agent
        shell: bash
        run: >-
          scripts/with-build-cache-guard.sh
          cargo clippy --locked -p envoix-cli -p envoix-agent --all-targets -- -D warnings
      - name: Test Windows CLI and Agent
        shell: bash
        run: >-
          scripts/with-build-cache-guard.sh
          cargo test --locked -p envoix-cli -p envoix-agent --all-targets
      - name: Build Windows lifecycle pair
        shell: bash
        run: >-
          scripts/with-build-cache-guard.sh
          cargo build --locked -p envoix-cli -p envoix-agent
      - name: Test Windows Agent lifecycle
        shell: pwsh
        run: >-
          ./scripts/windows-agent-lifecycle-test.ps1
          -Cli ./target/debug/envoix.exe
          -Agent ./target/debug/envoix-agent.exe

  android:
    name: Android lint + unit test + debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Set up Rust and Android target
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add --toolchain "$RUST_VERSION" aarch64-linux-android
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-ndk
        run: >-
          scripts/with-build-cache-guard.sh
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
      - name: Check Android JNI compatibility
        run: scripts/check-android-jni-transfer-surface.sh
      - name: Lint, test, and build Android
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
          ENVOIX_ANDROID_ABIS: arm64-v8a
        run: >-
          ../scripts/with-build-cache-guard.sh
          ./gradlew
          :app:ktlintCheck
          :app:lintDebug
          :app:testDebugUnitTest
          :app:assembleDebug
          --no-daemon
          --stacktrace
      - name: Verify packaged JNI library
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 android/app/build/outputs/apk/debug/app-debug.apk | grep -Fx 'lib/arm64-v8a/libenvoix_ffi.so'
          if unzip -Z1 android/app/build/outputs/apk/debug/app-debug.apk | grep -Fq 'libenvoix_jni.so'; then
            echo 'legacy libenvoix_jni.so must not be packaged' >&2
            exit 1
          fi
