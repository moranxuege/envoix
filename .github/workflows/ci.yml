name: ci

# Gates for the envoix 0.2.0 clean rebuild: rustfmt, clippy, the workspace test
# suite, and the xtask registry gates (identifier-check + arch-check). The old
# Android tree lives frozen under legacy/ and is not linted here; an Android
# lint job returns with the Flutter host at BN4.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  rust:
    name: rust gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace
      - name: identifier registry gate
        run: cargo run -q -p xtask -- identifier-check
      - name: architecture gate
        run: cargo run -q -p xtask -- arch-check
