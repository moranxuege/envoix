name: ci

# Enforce formatting, Rust tests, and Android build/lint checks on PRs or explicit runs.
on:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: rust fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --all-targets

  android:
    name: android lint + JNI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Rust + Android target
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Install NDK r26 + SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
      - name: Kotlin style
        working-directory: android
        run: ./gradlew :app:ktlintCheck --no-daemon --stacktrace
      - name: Lint
        working-directory: android
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace
      - name: Check Android JNI compatibility
        run: scripts/check-android-jni-transfer-surface.sh
      - name: Run Android unit tests and build app/instrumentation APKs
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
          ENVOIX_ANDROID_ABIS: arm64-v8a
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Verify Android test artifacts
        run: |
          test -s android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          unzip -Z1 android/app/build/outputs/apk/debug/app-debug.apk | grep -Fx 'lib/arm64-v8a/libenvoix_jni.so'
