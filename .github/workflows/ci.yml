name: ci

# Gates for the envoix 0.2.0 clean rebuild: rustfmt, clippy, the workspace test
# suite, and the xtask registry gates (identifier-check + arch-check). The old
# Android tree lives frozen under legacy/ and is not linted here; an Android
# lint job returns with the Flutter host at BN4.
#
# The release trust gate has two halves and they run in two places. Its ARTIFACT
# half (`xtask release-gate`) judges signed release artifacts, which this
# workflow cannot produce — the signing key is deliberately not available to a
# public repository's CI — so it is wired into the release task graph instead:
# `:app:assembleRelease` and `:app:bundleRelease` both depend on `:app:releaseGate`.
# Its IDENTITY half runs HERE, inside `cargo test`: `release_trust` compares the
# checked-in declaration, the flat policy projection, the packaged build-manifest
# asset and the payload record against what this build actually compiles, and
# `release_cdylib_omits_debug_instrumentation` builds the host cdylib and asserts
# its exported symbols equal the release allow-list.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  rust:
    name: rust gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      # `--all-features` because the packaged instrumentation lane is behind
      # `e2e-instrumentation` and was therefore never compiled by this gate — the
      # one body of code BN5 pins symbol-by-symbol was the one body of code
      # nothing linted.
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: tests
        run: cargo test --workspace
      - name: identifier registry gate
        run: cargo run -q -p xtask -- identifier-check
      - name: architecture gate
        run: cargo run -q -p xtask -- arch-check
