name: _verify-android

# TEMPORARY: verifies the Android APK build on CI in isolation (no macOS CLI
# jobs). Deleted once green; the real job lives in release.yml.
on:
  push:
    branches: [feat/android-app]

jobs:
  android:
    name: build android apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust + Android targets
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android
          rustc --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r26 + SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"

      - name: Cross-compile the JNI core (arm64-v8a + x86_64)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/26.3.11579264"
          cargo ndk -t arm64-v8a -t x86_64 --platform 26 build --release -p envoix-android-jni
          mkdir -p android/app/src/main/jniLibs/arm64-v8a android/app/src/main/jniLibs/x86_64
          cp target/aarch64-linux-android/release/libenvoix_jni.so android/app/src/main/jniLibs/arm64-v8a/
          cp target/x86_64-linux-android/release/libenvoix_jni.so android/app/src/main/jniLibs/x86_64/

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/envoix-android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: envoix-android.apk
          path: dist/envoix-android.apk
          if-no-files-found: error
