[package]
name = "envoix-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "envoix_ffi"
crate-type = ["lib", "staticlib"]

[[bin]]
name = "envoix-bindgen"
path = "src/bin/envoix-bindgen.rs"
required-features = ["bindgen-cli"]

[features]
bindgen-cli = ["uniffi/cli"]

[dependencies]
envoix-client.workspace = true
envoix-qr.workspace = true
envoix-rendezvous-iroh.workspace = true
envoix-storage.workspace = true
envoix-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uniffi.workspace = true
thiserror.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[dev-dependencies]
blake3.workspace = true
envoix-rendezvous.workspace = true
iroh.workspace = true
tempfile.workspace = true
