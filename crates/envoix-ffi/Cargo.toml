[package]
name = "envoix-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "envoix_ffi"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "envoix-bindgen"
path = "src/bin/envoix-bindgen.rs"
required-features = ["bindgen-cli"]

[features]
android-jni = ["dep:jni", "dep:ndk-context"]
bindgen-cli = ["uniffi/cli"]

[dependencies]
async-trait.workspace = true
envoix-client.workspace = true
envoix-error.workspace = true
envoix-protocol.workspace = true
envoix-qr.workspace = true
envoix-rendezvous-iroh.workspace = true
envoix-types.workspace = true
base64.workspace = true
getrandom.workspace = true
jni = { version = "0.21", optional = true }
ndk-context = { version = "0.1", optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uniffi.workspace = true
thiserror.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
