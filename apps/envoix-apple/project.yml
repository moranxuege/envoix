name: Envoix
options:
  bundleIdPrefix: com.envoix
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  EnvoixCore:
    path: ../../crates/envoix-ffi/EnvoixCore

targets:
  Envoix:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Sources
      - Shared/ShareDraftStore.swift
      - Assets.xcassets
      - Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: EnvoixCore
      - target: EnvoixEngineHelper
        embed: true
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.envoix.app
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "5"
        ENVOIX_BUILD_TIMESTAMP: "unavailable"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info-macOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        # The Rust static library (iroh / objc2) references these system
        # frameworks. CoreWLAN is looked up dynamically at runtime, so it must
        # be linked or the app panics during network setup.
        OTHER_LDFLAGS:
          - "-framework"
          - "SystemConfiguration"
          - "-framework"
          - "Security"
          - "-framework"
          - "SecurityFoundation"
          - "-framework"
          - "CoreWLAN"
          - "-framework"
          - "CoreBluetooth"

  EnvoixEngineHelper:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Helper
        excludes:
          - Info.plist
          - EnvoixEngineHelper.entitlements
      - Sources/AppleApplicationVault.swift
      - Sources/AppleKeychainAccess.swift
      - Sources/EnvoixCoreContract.swift
      - Sources/EnvoixDefaults.swift
      - Sources/MacOSAgentBoundary.swift
    dependencies:
      - package: EnvoixCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.envoix.app.engine-helper
        PRODUCT_NAME: EnvoixEngineHelper
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "5"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Helper/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        SKIP_INSTALL: YES
        OTHER_LDFLAGS:
          - "-framework"
          - "SystemConfiguration"
          - "-framework"
          - "Security"
          - "-framework"
          - "SecurityFoundation"
          - "-framework"
          - "CoreWLAN"
          - "-framework"
          - "CoreBluetooth"
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: Helper/EnvoixEngineHelper.entitlements

  Envoix-iOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
      - Shared
      - Assets.xcassets
      - path: Resources
        excludes:
          - Info.plist
          - Info-macOS.plist
          - Envoix-iOS.entitlements
    dependencies:
      - package: EnvoixCore
      - target: EnvoixShare
        embed: true
      - sdk: CoreNFC.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.envoix.app.ios
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "5"
        ENVOIX_BUILD_TIMESTAMP: "unavailable"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Envoix-iOS.entitlements
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6638TTB2SF
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_CFBundleDisplayName: Envoix
        INFOPLIST_KEY_NSCameraUsageDescription: "Envoix uses the camera to scan invite QR codes from receiving devices."
        INFOPLIST_KEY_NFCReaderUsageDescription: "Envoix reads invitations from nearby Envoix phones."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Envoix connects to nearby devices on your local network to transfer files."
        OTHER_LDFLAGS:
          - "-framework"
          - "SystemConfiguration"
          - "-framework"
          - "Network"
          - "-framework"
          - "Security"
  EnvoixShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ShareExtension
        excludes:
          - Info.plist
          - EnvoixShare.entitlements
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.envoix.app.ios.share
        PRODUCT_NAME: EnvoixShare
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "5"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/EnvoixShare.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6638TTB2SF
        TARGETED_DEVICE_FAMILY: "1,2"

  Envoix-iOSUITests:
    # The transfer core opens sockets itself. Host these tests in the app so
    # they inherit the app's networking and local-network permissions instead
    # of the isolated UI-test runner's network sandbox.
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Tests/EnvoixIOSUITests
    dependencies:
      - target: Envoix-iOS
      - package: EnvoixCore
      - sdk: CoreNFC.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.envoix.app.ios.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6638TTB2SF
        TEST_TARGET_NAME: Envoix-iOS
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Envoix-iOS.app/Envoix-iOS"
        BUNDLE_LOADER: "$(TEST_HOST)"
        OTHER_LDFLAGS:
          - "-framework"
          - "SystemConfiguration"
          - "-framework"
          - "Network"
          - "-framework"
          - "Security"

  Envoix-iOSAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Tests/EnvoixIOSAppUITests
    dependencies:
      - target: Envoix-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.envoix.app.ios.app-uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6638TTB2SF
        TEST_TARGET_NAME: Envoix-iOS

  Envoix-macOSUITests:
    # Host cross-device tests in the production macOS app so the Rust core
    # uses the same network and filesystem environment as the shipped client.
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Tests/EnvoixIOSUITests/ManifestV2PhysicalTransferTests.swift
      - Tests/EnvoixIOSUITests/AppleWifiAwareControlChannelRegistryTests.swift
      - Tests/EnvoixIOSUITests/AppleWifiAwareControlRoleStoreTests.swift
      - Tests/EnvoixIOSUITests/AppleWifiAwareServiceCoordinatorTests.swift
      - Tests/EnvoixIOSUITests/WifiAwareRendezvousProtocolTests.swift
      - Tests/EnvoixIOSUITests/ApplicationEngineAdapterTests.swift
      - Tests/EnvoixIOSUITests/AppleApplicationVaultTests.swift
      - Tests/EnvoixMacOSUITests/ConnectionHubPresentationTests.swift
      - Tests/EnvoixMacOSUITests/MacOSAgentControlTests.swift
      - Tests/EnvoixMacOSUITests/MacNearbyIntegrationTests.swift
      - Tests/EnvoixMacOSUITests/RoomCodeInputFormatterTests.swift
    dependencies:
      - target: Envoix
      - package: EnvoixCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.envoix.app.macos.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Envoix
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Envoix.app/Contents/MacOS/Envoix"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        OTHER_LDFLAGS:
          - "-framework"
          - "SystemConfiguration"
          - "-framework"
          - "Security"
          - "-framework"
          - "SecurityFoundation"
          - "-framework"
          - "CoreWLAN"
          - "-framework"
          - "CoreBluetooth"

  Envoix-macOSClipboardTests:
    # Clipboard and credential-store tests are intentionally unhosted so they
    # cannot initialize the production app or touch persistent user data.
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Sources/ClipboardIntake.swift
      - Sources/AppleKeychainAccess.swift
      - Sources/RememberedPeers.swift
      - Shared/ShareDraftStore.swift
      - Tests/EnvoixMacOSUITests/ClipboardIntakeTests.swift
      - Tests/EnvoixMacOSUITests/RememberedPeerStoreTests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.envoix.app.macos.clipboard-tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO

  EnvoixEngineHelperTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Helper/AgentHostRuntime.swift
      - Sources/AppleApplicationVault.swift
      - Sources/AppleKeychainAccess.swift
      - Sources/EnvoixCoreContract.swift
      - Sources/EnvoixDefaults.swift
      - Sources/MacOSAgentBoundary.swift
      - Tests/EnvoixEngineHelperTests
    dependencies:
      - package: EnvoixCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.envoix.app.engine-helper.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        OTHER_LDFLAGS:
          - "-framework"
          - "SystemConfiguration"
          - "-framework"
          - "Security"
          - "-framework"
          - "SecurityFoundation"
          - "-framework"
          - "CoreWLAN"
          - "-framework"
          - "CoreBluetooth"

schemes:
  Envoix:
    build:
      targets:
        Envoix: all

  Envoix-iOS:
    build:
      targets:
        Envoix-iOS: all
        Envoix-iOSUITests: [test]
        Envoix-iOSAppUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - Envoix-iOSUITests
        - Envoix-iOSAppUITests

  Envoix-iOS-Hosted:
    build:
      targets:
        Envoix-iOS: all
        Envoix-iOSUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - Envoix-iOSUITests

  Envoix-iOS-AppUI:
    build:
      targets:
        Envoix-iOS: all
        Envoix-iOSAppUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - Envoix-iOSAppUITests

  Envoix-macOS-Hosted:
    build:
      targets:
        Envoix: all
        Envoix-macOSUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - Envoix-macOSUITests

  Envoix-macOS-Clipboard:
    build:
      targets:
        Envoix-macOSClipboardTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - Envoix-macOSClipboardTests

  Envoix-EngineHelper:
    build:
      targets:
        EnvoixEngineHelper: all
        EnvoixEngineHelperTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - EnvoixEngineHelperTests
