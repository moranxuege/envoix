# The generated binding is analysed with the app, so a contract artifact that
# stops compiling in a real Flutter package fails `flutter analyze` here.
analyzer:
  language:
    strict-casts: true
    strict-raw-types: true

# `!=` between an enum and a bool is legal Dart and always true. That is not a
# style question here: the routing this app does is a chain of typed verdicts,
# and a comparison against the wrong type silently turns one into "always".
linter:
  rules:
    - unrelated_type_equality_checks
