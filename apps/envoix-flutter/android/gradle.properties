org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official

# The ABIs the release policy requires; without it the Flutter tool would also
# compile an armeabi-v7a payload that `abiFilters` then drops.
target-platform=android-arm64,android-x64

# Keep R8 off the release build. The Flutter plugin turns minification on by
# default, which renames classes — and `NativeHost`'s package and class name ARE
# the JNI entry point names the release payload exports. A renamed class means
# six symbols nothing can bind. The release surface stays what BN5 pinned:
# unminified, no proguard files, no resource shrinking.
shrink=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
