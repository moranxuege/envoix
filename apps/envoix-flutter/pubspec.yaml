name: envoix
description: >-
  The Envoix frontend. It attaches to the running host, renders the cards it
  decodes, and submits the commands the authority publishes for them.
publish_to: none
version: 0.2.0

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

# No third-party packages, and no assets of our own: the only things that cross
# into this app are the two contracts, as generated code (lib/bindings links the
# generator's own output).
flutter:
  uses-material-design: false
