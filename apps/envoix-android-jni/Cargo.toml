[package]
name = "envoix-android-jni"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
name = "envoix_jni"

[dependencies]
envoix-client = { path = "../../crates/envoix-client" }
jni = "0.21"
ndk-context = "0.1"
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
