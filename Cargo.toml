[workspace]
resolver = "2"
members = ["crates/*/*", "hosts/*", "apps/*", "tools/*"]
exclude = ["legacy"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
blake3 = { version = "1", features = ["zeroize"] }
chacha20poly1305 = "0.10"
getrandom = "0.3"
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spake2 = "0.4"
zeroize = "1"
