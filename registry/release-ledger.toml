# The COMPLETE set of entries an app bundle carries that are the CONTAINER's
# rather than the app's: bundletool's module descriptors, AGP's bundle metadata
# and the JAR signature block. Everything else in an `.aab` is app content and
# is judged against `allowed_package_entries` above, after its module prefix is
# stripped (`base/dex/`, `base/manifest/` and `base/root/` map onto the archive
# root; `base/assets/`, `base/lib/` and `base/res/` keep their directory).
#
# This list exists because the surface rule used to be OFF for bundles — the
# artifact D2 uploads — on the argument that a bundle's layout is bundletool's
# to define. Its layout is, and that is all this names; the payload inside it is
# ours, reviewed once, in one place. An entry that is neither app content nor
# named here fails exactly as it does in an APK.
#
# `*` is the ABI in the debug-symbol paths (the payload itself ships no `.sym`:
# it is stripped at link) and the signer alias in the signature block, which is
# a keystore fact this repository never writes down. The signer is judged by
# certificate fingerprint, not by the name of its block file.
allowed_bundle_entries = [
    "BUNDLE-METADATA/com.android.tools.build.debugsymbols/*/libapp.so.sym",
    "BUNDLE-METADATA/com.android.tools.build.debugsymbols/*/libflutter.so.sym",
    "BUNDLE-METADATA/com.android.tools.build.gradle/app-metadata.properties",
    "BUNDLE-METADATA/com.android.tools.build.libraries/dependencies.pb",
    "BUNDLE-METADATA/com.android.tools.build.profiles/baseline.prof",
    "BUNDLE-METADATA/com.android.tools.build.profiles/baseline.profm",
    "BundleConfig.pb",
    "META-INF/*.RSA",
    "META-INF/*.SF",
    "META-INF/MANIFEST.MF",
    "base/assets.pb",
    "base/native.pb",
    "base/resources.pb",
]

# What the packaged payload is BUILT FROM, as Ant-style globs relative to the
# repository root. `cargo run -p xtask -- record-payload` digests exactly these
# files into `sources_sha256`, and the app's `verify<BuildType>JniLibs` task
# feeds the same list to its freshness check — one enumeration, two consumers,
# so the two enforcers cannot answer "what determines the payload" differently.
#
# It is the dependency closure and not a contract surface: every crate and host
# source, their manifests, the resolved lockfile, binding schemas/generated
# artifacts, `.cargo/config.toml`'s link flags, the Android/Gradle recipe, the
# native build script and the pinned rustc/Cargo/NDK identity. A pattern that
# matches no file is an error, so this list cannot go quietly inert.
payload_sources = [
    ".cargo/config.toml",
    "Cargo.lock",
    "Cargo.toml",
    "registry/android-native-toolchain.properties",
    "crates/**/*.rs",
    "crates/**/Cargo.toml",
    "crates/l5/envoix-bindings/generated/**",
    "crates/l5/envoix-bindings/schema/*.schema",
    "hosts/**/*.rs",
    "hosts/**/Cargo.toml",
    "apps/envoix-flutter/android/**/*.gradle.kts",
    "apps/envoix-flutter/android/gradle.properties",
    "apps/envoix-flutter/android/gradle/wrapper/gradle-wrapper.properties",
    "apps/envoix-flutter/android/scripts/build-jni-libs.sh",
]

# Substrings of the packaged app manifest, as `aapt2 dump xmltree` renders it,
# that only a debug-shaped build may carry: the debuggable/testOnly flags, the
# debug-only instrumentation permission and the component it guards, and any
# network-security-config reference (that is where a debug trust override would
# have to be declared to have any effect).
# The COMPLETE set of permissions a release may request, judged in BOTH
# directions: a permission the artifact requests and this list does not name
# fails, and a name here the artifact never requests fails too.
#
# The markers list below cannot do this job. It is a DENY-list, so it rejects
# only the debug spellings somebody thought to write down — a NEW permission,
# which is the one case actually worth a human's attention, would have slid
# past it silently. Asking a user for their camera is a product decision, and
# this is where it is made rather than discovered.
#
# CAMERA is the `scan_invite` capability's, requested at runtime and refusable:
# a refusal is an answer the frontend draws, and pasting an invite still works.
allowed_permissions = [
    "android.permission.CAMERA",
    # androidx.core's own, added by its manifest and scoped to the application
    # id. `{application_id}` expands to the variant's own id, so this is claimed
    # once and still judged exactly — `dev` may not carry `prod`'s spelling,
    # which a wildcard would have allowed.
    #
    # It is not new: this build already shipped it, and the deny-list that this
    # allow-list replaces could not see it. Finding it is the point.
    "{application_id}.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION",
    "android.permission.FOREGROUND_SERVICE",
    "android.permission.FOREGROUND_SERVICE_DATA_SYNC",
    "android.permission.INTERNET",
    "android.permission.POST_NOTIFICATIONS",
    "android.permission.WAKE_LOCK",
]

forbidden_manifest_markers = [":debuggable(", ":testOnly(", ".permission.E2E", ":networkSecurityConfig("]

# Class names the release dex may never define. The debug instrumentation
# bridge exists only in the debug source set, so a release APK that still
# defines it was built from the wrong sources.
forbidden_release_classes = ["E2eBridge"]

# "internal": signed with the real key but not distributed to anyone (what BN5
# builds). "public": additionally requires a provisioned deployment trust root,
# so flipping this before D1 has provisioned `deploy/environments.toml` fails
# every release build. D2 owns the flip. Both enforcers read the DECISION this
# implies (`trust_root_required` in the projection), never the spelling.
distribution = "internal"

# Append-only record of what has actually been released, one row per
# (applicationId, versionCode). The release action appends a row; nothing ever
# edits one. A build whose pair is already present fails, and so does one whose
# versionCode regresses below its applicationId's highest released number —
# three applicationIds share this file but never share a number.
#
# Empty: nothing has been released yet (BN5 is a trust gate, D2 publishes).
#
# [[released]]
# application_id = "app.envoix.host"
# version_code = 1
