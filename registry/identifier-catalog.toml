[meta]
schema_version = 1
purpose = "Owner index for fresh Envoix 0.2.0 identifiers"
live_values_allowed = false
default_comparison = "exact-within-collision-scope"

# This file is an index, not a value store. `extract` names the mechanical way
# `xtask identifier-check` obtains the live value from its sole owner.

# -----------------------------------------------------------------------------
# Workspace, protocol set, and wire dialects
# -----------------------------------------------------------------------------

[[identifier]]
key = "build.workspace_package_version"
owner = "manifest:root-cargo"
owner_path = "Cargo.toml"
collision_scope = "workspace-package-version"
extract = "toml-key:workspace.package.version"

[[identifier]]
key = "protocol.set_id"
owner = "crate:envoix-protocol"
owner_path = "crates/l1/envoix-protocol/src/identifiers.rs"
collision_scope = "protocol-set-id"
extract = "rust-const:PROTOCOL_SET_ID"

[[identifier]]
key = "protocol.data.alpn"
owner = "crate:envoix-protocol"
owner_path = "crates/l1/envoix-protocol/src/identifiers.rs"
collision_scope = "alpn"
extract = "rust-bytes-const:DATA_ALPN"

[[identifier]]
key = "protocol.data.magic"
owner = "crate:envoix-protocol"
owner_path = "crates/l1/envoix-protocol/src/identifiers.rs"
collision_scope = "data-wire-dialect-component"
comparison = "compare-only-as-data-dialect-tuple"
extract = "rust-bytes-const:DATA_MAGIC"

[[identifier]]
key = "protocol.data.wire_version"
owner = "crate:envoix-protocol"
owner_path = "crates/l1/envoix-protocol/src/identifiers.rs"
collision_scope = "data-wire-dialect-component"
comparison = "compare-only-as-data-dialect-tuple"
extract = "rust-const:DATA_WIRE_VERSION"

[[identifier]]
