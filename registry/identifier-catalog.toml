owner = "crate:envoix-rendezvous"
owner_path = "crates/l2/envoix-rendezvous/src/identifiers.rs"
collision_scope = "alpn"
extract = "rust-bytes-const:RENDEZVOUS_ALPN"

[[identifier]]
key = "protocol.rendezvous.magic"
owner = "crate:envoix-rendezvous"
owner_path = "crates/l2/envoix-rendezvous/src/identifiers.rs"
collision_scope = "rendezvous-wire-dialect-component"
