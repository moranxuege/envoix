[meta]
schema_version = 1
purpose = "Authoritative Envoix dev/test/prod deployment identifiers"
node_endpoint_derivation = "<node_id>@<rendezvous.host>:<rendezvous.port>"
https_url_derivation = "https://<service.host>:<service.port>"
provisioned_status = "provisioned"

# Ports owned by services this project does not run. They are listed here so
# that one file answers "may I bind this?": `xtask deploy-check` rejects any
# environment that claims one, and the server refuses to bind one whatever the
# command line says.
[[reserved_port]]
port = 8444
owner = "iroh-relay.service"
note = "third-party live service on the shared host"

[[reserved_port]]
port = 8445
owner = "envoix-rendezvous.service"
note = "third-party live service on the shared host"

[[reserved_port]]
port = 8446
owner = "envoix-rendezvous.service"
note = "third-party live service on the shared host"

# Every key below is READ by `xtask deploy-check`; none of them is a comment.
# The parse rejects an unknown key and a missing one, so this table cannot
# drift into claiming a rule that nothing enforces — which is exactly what
# `require_distinct_hosts` did before D1.
[validation]
allowed_environments = ["dev", "test", "prod"]
require_distinct_hosts = true
require_distinct_node_ids = true
reject_legacy_node_ids = true
reject_legacy_hosts = true
node_id_format_when_provisioned = "hex64"
# The port block IS part of an environment's identity: two UDP listeners cannot
# share a port on one host, and hostnames do not tell a validator whether two
# environments share a machine. Each environment owns a hundred-block; the last
# two digits keep their service meaning so the service is readable from the
# number. 95xx is deliberately unallocated, so a mistyped block lands on
# nothing rather than on a neighbouring environment.
require_distinct_port_blocks = true
require_consistent_service_port_suffixes = true
require_loopback_diagnostics_bind = true
unallocated_port_blocks = [95]

# The service meaning of the last two digits, identical in every block.
[validation.service_port_suffix]
relay = 44
rendezvous = 45
mailbox = 60
evidence = 61
diagnostics = 62

# An environment is deployable once its rendezvous node id is a real key and
# its status says `provisioned`. That id IS the identity a client
# authenticates: the rendezvous is QUIC/iroh and speaks raw public keys, and
# the HTTPS services are terminated by the CDN in front of them, so there is no
# certificate of ours in this file to pin. Until the id is replaced,
# `xtask deploy-check` reports the environment as blocked and `envoix-server
# --environment <name>` refuses to start.

[environment.dev]
name = "dev"
port_block = 96

[environment.dev.rendezvous]
host = "rdz.dev.envoix.chkxwlyh.us"
port = 9645
# Promoted from test by owner decision: this identity is derived from the
# `rendezvous-node.key` already on the VPS, so promoting it is a catalogue
# move, not a re-key. The running server keeps the identity clients know and
# changes only its port block.
node_id = "26117638e1bc254b31fa343e55db98313279a5a689f9e66a04a731ad62ad0501"
provisioning_status = "provisioned"

[environment.dev.relay]
scheme = "https"
host = "relay.dev.envoix.chkxwlyh.us"
port = 9644

[environment.dev.mailbox]
scheme = "https"
host = "mailbox.dev.envoix.chkxwlyh.us"
port = 9660

[environment.dev.evidence]
scheme = "https"
host = "evidence.dev.envoix.chkxwlyh.us"
port = 9661

# Operator surface, reached through an SSH tunnel and never from the internet.
# It has a bind rather than a host because it is not a published endpoint.
[environment.dev.diagnostics]
bind = "127.0.0.1"
port = 9662

[environment.test]
name = "test"
port_block = 97

[environment.test.rendezvous]
host = "rdz.test.envoix.chkxwlyh.us"
port = 9745
# Vacated: the identity this environment held was promoted to dev. A test
# environment now needs its own key, and holding NO id is the honest state —
# an environment must never share dev's identity.
node_id = "TBD_PROVISION_TEST_RENDEZVOUS_NODE_ID"
provisioning_status = "tbd"

[environment.test.relay]
scheme = "https"
host = "relay.test.envoix.chkxwlyh.us"
port = 9744

[environment.test.mailbox]
scheme = "https"
host = "mailbox.test.envoix.chkxwlyh.us"
port = 9760

[environment.test.evidence]
scheme = "https"
host = "evidence.test.envoix.chkxwlyh.us"
port = 9761

[environment.test.diagnostics]
bind = "127.0.0.1"
port = 9762

[environment.prod]
name = "prod"
port_block = 94

[environment.prod.rendezvous]
host = "rdz.prod.envoix.chkxwlyh.us"
port = 9445
node_id = "TBD_PROVISION_PROD_RENDEZVOUS_NODE_ID"
provisioning_status = "tbd"

[environment.prod.relay]
scheme = "https"
host = "relay.prod.envoix.chkxwlyh.us"
port = 9444

[environment.prod.mailbox]
scheme = "https"
host = "mailbox.prod.envoix.chkxwlyh.us"
port = 9460

[environment.prod.evidence]
scheme = "https"
host = "evidence.prod.envoix.chkxwlyh.us"
port = 9461

[environment.prod.diagnostics]
bind = "127.0.0.1"
port = 9462
